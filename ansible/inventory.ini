# Inventory for the HKU ENGG Intranet deployment (UAT and PROD).
#
# The lab layout:
#
#   192.168.147.103   DB     the PostgreSQL server — one instance, one database
#                              and one role per environment
#   192.168.147.104   UAT    the intranet container (user uat) AND the CI host
#                              (Jenkins, the image registry, Aqua); it reaches
#                              the database on .103 over the network
#   192.168.147.105   PROD   the intranet container (user rhai) only — the live
#                              site, with no CI on the box at all
#
# Why CI sits with UAT and not with PROD: the pipeline builds and pushes
# images, which is untrusted work (it runs the app's install scripts and
# third-party packages). The database is the asset that has to stay away from
# untrusted work; the application host is a much smaller prize, and the PROD
# container there runs as a non-root user out of a systemd unit that the
# pipeline never touches.
#
# The registry is on the CI host too, so UAT pulls it over loopback and PROD
# pulls it over the network — which is the same path a real promotion takes.
#
# .104 is also the DR site of the OTHER demo (the RHEL MCP failover drill);
# the two projects sit on it side by side, on different ports.
#
# Each site is driven as its OWN non-root user with rootless podman and a
# systemd USER unit. The role never uses `become`, so no sudo password is ever
# needed on the target and the deploy user does not need to be in the wheel
# group.
#
#   UAT   user uat    the intranet container
#   PROD  user rhai   the live site
#
# What actually separates UAT from PROD:
#   * the host                     192.168.147.104   vs  192.168.147.105
#   * the container name           hku-intranet-uat  vs  hku-intranet
#   * the systemd user unit        hku-intranet-uat.service vs hku-intranet.service
#   * the port                     8097              vs  8093
#   * the environment file         hku-intranet-uat.env vs env.list
#   * the database                 engg_intranet_uat vs  engg_intranet
#   * the database role            engg_uat          vs  engg_prod
#
# The environment file carries PORT and DB_NAME, so the two containers differ
# by FILE, not by -e overrides on the command line.
#
# Each environment owns its env file outright. The UAT file on .104 is NOT a
# copy of the PROD one: it carries UAT's own database role and password, so
# the UAT container cannot open the PROD database even though both databases
# live on the same PostgreSQL host. The role only checks PORT and DB_NAME.
#
# ansible_python_interpreter is PINNED, not auto-discovered: RHEL 8 ships
# Python 3.6 as /usr/bin/python3, but ansible-core >= 2.15 requires a target
# interpreter of 3.7 or newer. Both sites run the python39 package and the
# inventory points at it explicitly so the controller never guesses
# differently on each host.

[intranet_uat]
uat ansible_host=192.168.147.104 ansible_user=uat ansible_python_interpreter=/usr/bin/python3.9 intranet_role=UAT intranet_port=8097 intranet_db_name=engg_intranet_uat intranet_container_name=hku-intranet-uat intranet_service_name=hku-intranet-uat.service intranet_env_file=/home/uat/hku-intranet/hku-intranet-uat.env intranet_env_source=/home/uat/hku-intranet/env.list intranet_backups_dir=/home/uat/hku-intranet/backups

[intranet_prod]
prod ansible_host=192.168.147.105 ansible_user=rhai ansible_python_interpreter=/usr/bin/python3.9 intranet_role=PROD intranet_port=8093 intranet_db_name=engg_intranet intranet_container_name=hku-intranet intranet_service_name=hku-intranet.service intranet_env_file=/home/rhai/hku-intranet/env.list intranet_env_source=/home/rhai/hku-intranet/env.list intranet_backups_dir=/home/rhai/hku-intranet/backups

[intranet_sites:children]
intranet_uat
intranet_prod
